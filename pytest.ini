[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning
    # starlette's TestClient still reads the deprecated anyio.abc.BlockingPortal
    # alias at import time. With `error` above, that aborts collection of every
    # test file before any of our code runs. The alias lives in a transitive
    # dependency we do not pin, so this stays ignored until starlette updates;
    # it is scoped to that one alias and does not relax any other warning.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning

