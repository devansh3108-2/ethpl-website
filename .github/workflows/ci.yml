name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory sweep (Mondays 06:00 UTC) to catch newly published CVEs.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Tests & security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Byte-compile sources
        run: python -m compileall app.py api services.py schemas.py config.py

      - name: Run tests
        run: python -m pytest -q

      - name: Bandit security scan
        run: python -m bandit -r app.py api services.py schemas.py config.py

      - name: Dependency audit (runtime lock)
        run: python -m pip_audit -r requirements.txt
