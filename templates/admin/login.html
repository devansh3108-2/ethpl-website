<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin sign in | ETHPL</title>
  <link rel="stylesheet" href="{{ asset_url('css/theme.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/components.css') }}">
</head>
<body>
  <main class="container" style="max-width: 32rem; padding-top: 10vh;">
    <h1>Admin sign in</h1>
    <p>Enter the administrator password to continue.</p>
    {% if error %}<p role="alert" style="color: #b42318;">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next_path }}">
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required autofocus autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
